name: Motion memory probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build production image
        run: docker build -t kbc-motion-probe .
      - name: Measure under production resource limits
        run: python3 experiments/motion-memory/measure.py
      - name: Keep measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: motion-memory-results
          path: motion-memory-results.json
