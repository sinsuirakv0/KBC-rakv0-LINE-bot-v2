[package]
name = "kbc-node"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
kbc-core = { path = "../kbc-core" }
kbc-protocol = { path = "../kbc-protocol" }
napi = { version = "3", default-features = false, features = ["async", "dyn-symbols", "napi8", "serde-json"] }
napi-derive = "3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

[build-dependencies]
napi-build = "2"
